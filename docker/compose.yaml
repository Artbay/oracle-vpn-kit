# 【可选方案】用 Docker 运行 xray / hysteria2 / tuic（host 网络）。
# 默认方案仍是 scripts/ 下的 systemd 部署；两者二选一，不要同时运行（端口会冲突）。
# 端口跳跃、BBR、主机防火墙仍由宿主机负责（docker/prepare.sh 会调用同一套函数）。
# Cloudflare 隧道与订阅服务不在此 compose 里，仍用 scripts/install_cloudflared_tunnel.sh、scripts/serve_subscription.sh。
# 步骤见 docker/README.md。
name: oracle-vpn-kit

x-core: &core
  image: oracle-vpn-kit-cores:local
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      XRAY_VERSION: ${XRAY_VERSION:-}
      HY2_VERSION: ${HY2_VERSION:-}
      TUIC_VERSION: ${TUIC_VERSION:-1.0.0}
  network_mode: host
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  xray:
    <<: *core
    # 需要绑定 443 等低端口：以 root 运行但只保留 NET_BIND_SERVICE 一项能力
    cap_add:
      - NET_BIND_SERVICE
    command: ["/usr/local/bin/xray", "run", "-config", "/usr/local/etc/xray/config.json"]
    volumes:
      - ./conf/xray:/usr/local/etc/xray:ro

  hysteria2:
    <<: *core
    user: "65534:65534"
    command: ["/usr/local/bin/hysteria", "server", "--config", "/etc/hysteria/config.yaml"]
    volumes:
      - ./conf/hysteria:/etc/hysteria:ro

  tuic:
    <<: *core
    user: "65534:65534"
    command: ["/usr/local/bin/tuic-server", "-c", "/etc/tuic/config.json"]
    volumes:
      - ./conf/tuic:/etc/tuic:ro
